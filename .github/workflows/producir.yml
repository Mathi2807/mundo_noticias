name: Producir bucle de Mundo Noticias
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      minutos: {description: 'Duración del bucle en minutos (vacío = 90 automático)', required: false}
permissions: {contents: write}
jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: voz, key: voz-davefx-v1}
      - run: bash scripts/instalar_voz.sh
      - name: Producir
        run: |
          MIN="${{ github.event.inputs.minutos }}"
          python3 main.py producir --estado estado --salida salida ${MIN:+--minutos "$MIN"} --tras-seleccion "bash scripts/guardar_estado.sh"
      - uses: actions/upload-artifact@v4
        with: {name: bucle, path: "salida/bucle.mp4\nsalida/creditos.txt\nsalida/lista.json", retention-days: 1}
      - name: Clips verticales de 60-90 s
        continue-on-error: true
        run: python3 main.py clips --video salida/bucle.mp4 --lista salida/lista.json --salida clips
      - name: Publicar clips
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}"}
        run: bash scripts/publicar_clips.sh
      - name: Guardar estado final
        run: bash scripts/guardar_estado.sh
